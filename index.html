<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kompres Poster → WebP</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b;
    --text:#e7eaf0; --muted:#9aa3b2;
    --accent:#4f8cff; --accent2:#3a72e0;
    --border:#262b36; --ok:#3ecf8e;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; justify-content:center;
    padding:24px 16px;
  }
  .wrap{width:100%; max-width:720px}
  h1{font-size:20px; margin:0 0 6px; font-weight:700}
  .sub{color:var(--muted); font-size:13px; margin-bottom:18px; line-height:1.5}
  .sub b{color:var(--text)}
  .drop{
    background:var(--card); border:2px dashed var(--border);
    border-radius:16px; padding:32px 20px; text-align:center;
    cursor:pointer; transition:all .15s ease; display:block;
  }
  .drop:hover, .drop.over{ border-color:var(--accent); background:#151a26; }
  .drop .icon{font-size:32px; margin-bottom:8px}
  .drop .title{font-weight:600; margin-bottom:4px}
  .drop .hint{color:var(--muted); font-size:13px}
  input[type=file]{display:none}

  .list{margin-top:18px; display:flex; flex-direction:column; gap:12px}
  .item{
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:14px;
    display:flex; gap:14px; align-items:center;
    animation:in .2s ease;
  }
  @keyframes in{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
  .item img{
    width:80px; height:80px; object-fit:cover;
    border-radius:10px; background:#0b0d12; flex-shrink:0;
  }
  .meta{flex:1; min-width:0}
  .name{font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .stats{color:var(--muted); font-size:12px; margin-top:4px; display:flex; gap:10px; flex-wrap:wrap}
  .stats .save{color:var(--ok); font-weight:600}
  .stats .orig{text-decoration:line-through; opacity:.6}
  .actions{display:flex; gap:8px; flex-shrink:0}
  .btn{
    background:var(--accent); color:#fff; border:0;
    padding:8px 14px; border-radius:9px; cursor:pointer;
    font-weight:600; font-size:13px;
  }
  .btn:hover{background:var(--accent2)}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text)}
  .btn.ghost:hover{background:var(--card2)}
  .row-actions{margin-top:14px; display:flex; justify-content:flex-end; gap:8px}
  .empty{color:var(--muted); font-size:12px; text-align:center; margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kompres Poster → WebP</h1>
  <div class="sub">
    Otomatis resize ke <b>maks 700px</b> &amp; kompres <b>quality 78</b>.<br>
    100% client-side — gambar tidak dikirim ke server. Hasil auto-download.
  </div>

  <label class="drop" id="drop" for="file">
    <div class="icon">🖼️</div>
    <div class="title">Drop gambar atau klik untuk pilih</div>
    <div class="hint">JPG / PNG / WebP</div>
    <input type="file" id="file" accept="image/*" multiple />
  </label>

  <div class="list" id="list"></div>
  <div class="empty" id="empty">Belum ada file.</div>

  <div class="row-actions" id="rowActions" style="display:none">
    <button class="btn ghost" id="clearBtn">Bersihkan</button>
    <button class="btn" id="dlAll">Download Semua</button>
  </div>
</div>

<script>
// ---------- SETTING (boleh diubah kalau perlu) ----------
const CONFIG = {
  MAX_DIMENSION: 700,   // sisi terpanjang, cukup untuk retina desktop 322x181@2x
  QUALITY:       0.78,  // 0.78 aman untuk thumbnail kecil
  FORMAT:        'image/webp',
};

const $ = id => document.getElementById(id);
const drop = $('drop'), fileInput = $('file'), list = $('list');
const empty = $('empty'), rowActions = $('rowActions');

let items = [];

const fmtSize = b =>
  b < 1024 ? b + ' B'
  : b < 1024*1024 ? (b/1024).toFixed(1) + ' KB'
  : (b/1024/1024).toFixed(2) + ' MB';

const safeName = n =>
  (n.replace(/\.[^.]+$/, '').replace(/[^\w\-]+/g, '_').slice(0, 60) || 'poster');

function loadImage(file){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload  = ()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('load gagal')); };
    img.src = url;
  });
}

function canvasToBlob(canvas, type, quality){
  return new Promise((res, rej)=>{
    canvas.toBlob(b => b ? res(b) : rej(new Error('encode gagal')), type, quality);
  });
}

async function processFile(file){
  const img = await loadImage(file);
  const canvas = document.createElement('canvas');
  let w = img.width, h = img.height;
  if (Math.max(w, h) > CONFIG.MAX_DIMENSION){
    const scale = CONFIG.MAX_DIMENSION / Math.max(w, h);
    w = Math.round(w * scale);
    h = Math.round(h * scale);
  }
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);

  const blob = await canvasToBlob(canvas, CONFIG.FORMAT, CONFIG.QUALITY);
  return {
    id:       crypto.randomUUID(),
    url:      URL.createObjectURL(blob),
    blob,
    filename: safeName(file.name) + '.webp',
    origSize: file.size,
    newSize:  blob.size,
    w, h,
  };
}

function render(){
  list.innerHTML = '';
  if (!items.length){
    empty.style.display = 'block';
    rowActions.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  rowActions.style.display = 'flex';

  items.forEach(it=>{
    const saved = it.origSize > 0 ? ((1 - it.newSize/it.origSize)*100) : 0;
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <img src="${it.url}" alt="">
      <div class="meta">
        <div class="name">${it.filename}</div>
        <div class="stats">
          <span class="orig">${fmtSize(it.origSize)}</span>
          <span>→ ${fmtSize(it.newSize)}</span>
          <span class="save">${saved>0?('−'+saved.toFixed(0)+'%'):'0%'}</span>
          <span>${it.w}×${it.h}</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn" data-dl="${it.id}">Download</button>
      </div>`;
    list.appendChild(el);
  });

  list.querySelectorAll('[data-dl]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const it = items.find(x => x.id === btn.dataset.dl);
      if (it) downloadBlob(it.blob, it.filename);
    });
  });
}

function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

async function handleFiles(files){
  const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
  for (const f of arr){
    try {
      const item = await processFile(f);
      items.push(item);
      render();
      downloadBlob(item.blob, item.filename); // auto-download
    } catch (e){
      console.error(e);
      alert('Gagal proses: ' + f.name);
    }
  }
}

// events
fileInput.addEventListener('change', e=>{
  if (e.target.files.length) handleFiles(e.target.files);
  fileInput.value = '';
});

['dragenter','dragover'].forEach(ev=>{
  drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add('over'); });
});
['dragleave','drop'].forEach(ev=>{
  drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove('over'); });
});
drop.addEventListener('drop', e=>{
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

$('clearBtn').addEventListener('click', ()=>{
  items.forEach(it => URL.revokeObjectURL(it.url));
  items = [];
  render();
});

$('dlAll').addEventListener('click', ()=>{
  items.forEach((it, i)=> setTimeout(()=>downloadBlob(it.blob, it.filename), i*150));
});

render();
</script>
</body>
</html>
